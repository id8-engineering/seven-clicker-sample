name: Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build app
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 #v6.0.2
        with:
          path: seven-clicker-sample
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #v7.0.0
        with:
          python-version: 3.12

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@be8136a8bba01580485d98b7ad2d32477c36a49a #v1.0.15
        with:
          app-path: seven-clicker-sample
          toolchains: arm-zephyr-eabi
          ccache-cache-key: ubuntu-22.04

      - name: Build firmware
        working-directory: seven-clicker-sample
        shell: bash
        run: |
          west build -p always -b mikroe_clicker_2 app -- -DUSE_DUMMY_CREDS=ON
