name: dco-check
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  check_dco:
    runs-on: ubuntu-latest
    name: Check DCO
    steps:
      - name: Run dco-check
        uses: christophebedard/dco-check@ce494b79603fa6a2d61ce759a6fe051a67219c1c
        with:
          python-version: "3.14"
          args: "--verbose --exclude-pattern .*dependabot.*@users[.]noreply[.]github[.]com"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
